[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "Multi-strategy backtesting framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Dustin Erhard Theofilus", email = "dustintheofilus@gmail.com" }]

dependencies = [
  "pandas",
  "numpy",
  "pyarrow",
  "matplotlib",
  "python-dotenv",       # load API key from .env
]

[project.optional-dependencies]
data = [
  "yfinance",
  "nasdaq-data-link",
]
dev = [
  "pytest",
  "pyyaml",
  "ruff",
  "mypy",
  "pandas-stubs",        # type stubs so mypy understands pandas
]

[project.scripts]
quantlab-run = "quantlab.pipeline.cli:main"   # `quantlab-run --config ...`

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = ["3.12"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]